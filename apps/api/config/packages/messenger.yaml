framework:
    messenger:
        failure_transport: failed

        transports:
            # Phase 0: one transport. Phase 2 splits into platform_tixhub / platform_seatswap / platform_passmarket / platform_house.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: turnstile_async
                    group: workers
                    consumer: '%env(HOSTNAME)%'
                    auto_setup: true
                    delete_after_ack: true
            failed: 'doctrine://default?queue_name=failed'

        routing: []

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
