mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                # RFC 9068 claims required by mercure-bundle 0.6 when signing with a shared secret.
                claims:
                    iss: turnstile
                    sub: publisher
                    client_id: turnstile
