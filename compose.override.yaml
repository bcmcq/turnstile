# Local development: bind-mount the Symfony app so edits apply without a rebuild.
# Scaler-created workers copy the template worker's mounts, so they see the same code.
services:
  api:
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
      - api-var:/app/var
  worker:
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
      - api-var:/app/var
  publisher:
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
      - api-var:/app/var
  mocks:
    volumes:
      - ./apps/mocks:/app
  scaler:
    volumes:
      - ./apps/scaler:/app

volumes:
  api-vendor:
  api-var:
