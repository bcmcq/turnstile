name: turnstile

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  image: turnstile/api
  environment: &api-env
    APP_ENV: dev
    APP_SECRET: turnstile-dev-secret
    DATABASE_URL: mysql://${MYSQL_USER:-turnstile}:${MYSQL_PASSWORD:-turnstile}@mysql:3306/${MYSQL_DATABASE:-turnstile}?serverVersion=8.4&charset=utf8mb4
    REDIS_URL: redis://redis:6379
    LOCK_DSN: redis://redis:6379
    MERCURE_URL: http://api:8080/.well-known/mercure
    MERCURE_PUBLIC_URL: http://localhost:8080/.well-known/mercure
    MERCURE_JWT_SECRET: ${MERCURE_PUBLISHER_JWT_KEY:-turnstile-publisher-demo-key-change-me-0123456789}
    MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-turnstile-publisher-demo-key-change-me-0123456789}
    MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-turnstile-subscriber-demo-key-change-me-0123456789}
    MOCKS_BASE_URL: http://mocks:8090
    SCALER_URL: http://scaler:8070
    ADMIN_TOKEN: &admin-token ${ADMIN_TOKEN:-turnstile-admin-demo-token}
    # The one ceiling for the + stepper, Auto and the scaler. Set it in .env before first boot; see README → Sizing.
    MAX_WORKERS: &max-workers ${MAX_WORKERS:-32}
    ARENA_SIZE: ${ARENA_SIZE:-demo}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-turnstile}
      MYSQL_USER: ${MYSQL_USER:-turnstile}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-turnstile}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: --innodb-buffer-pool-size=512M --max-connections=300
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *api-image
    environment:
      <<: *api-env
      TURNSTILE_ROLE: api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *api-image
    environment:
      <<: *api-env
      TURNSTILE_ROLE: worker
    command:
      [
        "php",
        "bin/console",
        "messenger:consume",
        "control",
        "platform_tixhub",
        "platform_seatswap",
        "platform_passmarket",
        "platform_house",
        "--time-limit=3600",
        "--memory-limit=256M",
        "-vv",
      ]
    restart: unless-stopped
    healthcheck:
      disable: true # inherited FrankenPHP check probes Caddy, which workers do not run
    stop_grace_period: 15s
    scale: ${WORKER_SCALE:-2}
    depends_on:
      api:
        condition: service_healthy

  publisher:
    <<: *api-image
    environment:
      <<: *api-env
      TURNSTILE_ROLE: publisher
    command: ["php", "bin/console", "turnstile:publish", "-vv"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  mocks:
    build:
      context: .
      dockerfile: docker/mocks/Dockerfile
    image: turnstile/mocks
    environment:
      REDIS_URL: redis://redis:6379
      API_WEBHOOK_URL: http://api:8080/api/webhooks
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy

  scaler:
    build:
      context: .
      dockerfile: docker/scaler/Dockerfile
    image: turnstile/scaler
    environment:
      COMPOSE_PROJECT: turnstile
      WORKER_SERVICE: worker
      MIN_WORKERS: 1
      MAX_WORKERS: *max-workers
    volumes:
      # Demo only: the socket gives this container root on the host. See README → Scaling.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: turnstile/web
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_MERCURE_URL: http://localhost:8080/.well-known/mercure
      VITE_ADMIN_TOKEN: *admin-token
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules

volumes:
  mysql-data:
  web-node-modules:
