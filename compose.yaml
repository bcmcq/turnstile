name: turnstile

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  image: turnstile/api
  environment: &api-env
    APP_ENV: dev
    APP_SECRET: turnstile-dev-secret
    DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4
    REDIS_URL: redis://redis:6379
    MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
    MERCURE_URL: http://api:8080/.well-known/mercure
    MERCURE_PUBLIC_URL: http://localhost:8080/.well-known/mercure
    MERCURE_JWT_SECRET: ${MERCURE_PUBLISHER_JWT_KEY}
    MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
    MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY}
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --innodb-buffer-pool-size=512M --max-connections=300
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *api-image
    environment:
      <<: *api-env
      TURNSTILE_ROLE: api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *api-image
    environment:
      <<: *api-env
      TURNSTILE_ROLE: worker
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    healthcheck:
      disable: true   # inherited FrankenPHP check probes Caddy, which workers do not run
    stop_grace_period: 15s
    scale: ${WORKER_SCALE}
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
